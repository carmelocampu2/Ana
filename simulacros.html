<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b57"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Simulacros y progreso · Anatomía Murcia</title></head><body><main class="shell"><h1>Simulacros y progreso</h1><p>Banco de entrenamiento original. No son preguntas oficiales ni respuestas de una plantilla del SMS.</p><section class="card" id="setup"><h2>Configurar examen</h2><label>Preguntas <select id="amount"><option>20</option><option>50</option><option>100</option></select></label> <label>Contenido <select id="source"><option value="all">Todo el banco</option><option value="murcia">Legislación Murcia (banco principal)</option><option value="technical">Técnica (banco principal)</option><option value="review">Repaso avanzado (99)</option></select></label><p><label><input type="checkbox" id="penalty"> Penalizar errores (−1/3 de acierto)</label></p><p><label>Tiempo límite <select id="limit"><option value="0">Sin límite</option><option value="20">20 minutos</option><option value="45">45 minutos</option><option value="90">90 minutos</option></select></label> <label><input id="unseen" type="checkbox"> Priorizar preguntas menos practicadas</label></p><button id="resume" hidden>Continuar examen guardado</button> <button id="discard" hidden>Descartar examen guardado</button> <button id="start">Empezar simulacro</button> <button id="retry">Repetir falladas</button> <button id="bookmarked">Mis marcadas</button> <button id="export">Exportar historial JSON</button> <label class="importlabel">Importar copia de progreso <input type="file" id="import" accept="application/json,.json"></label><p id="availability"></p></section><section class="card" id="summary"><h2>Mi progreso</h2><div id="stats"></div><div id="topicstats"></div><div id="trend"></div><div id="history"></div><button id="clear">Borrar historial y fallos</button></section><section id="exam" hidden><div class="card"><strong id="progress"></strong> · <strong id="clock" role="timer"></strong> <button id="pause">Pausar</button> <button id="finish">Corregir examen</button></div><nav class="card" aria-label="Navegación del examen"><button id="prev">← Anterior</button> <span id="position"></span> <button id="next">Siguiente →</button><div id="questionmap" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:12px"></div></nav><div id="items"></div></section><section id="result" aria-live="polite"></section><p><a href="index.html">Volver a la aplicación</a></p></main><script src="simulacros.js" defer></script></body></html>
